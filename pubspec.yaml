name: untitled2
description: A new Flutter project.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider:
  intl:
  flutter_svg:
  flutter_animate:
  sqflite:

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: text
      fonts:
        - asset: assets/fonts/Bold.ttf
          weight: 700
        - asset: assets/fonts/Regular.ttf
          weight: 600
        - asset: assets/fonts/Thick.ttf
          weight: 500
  assets:
    - assets/
    - assets/icons/
    - assets/icons/menu/
    - assets/icons/category/
    - assets/icons/category/transfer/
    - assets/icons/category/computer/
    - assets/icons/category/furniture/
    - assets/icons/category/hobby/
